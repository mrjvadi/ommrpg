# Single origin for the Telegram Mini App: static Godot web export, the REST
# API, sprites and the Centrifugo websocket all live behind this server.
# Character sheet rendering is CPU-heavy and public: rate limit per client IP.
limit_req_zone $binary_remote_addr zone=sprites:10m rate=15r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The client is exported WITHOUT thread support, so no COOP/COEP headers
    # are needed (they would also block Telegram's telegram-web-app.js).

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css image/svg+xml;

    location = / { try_files /index.html =404; }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/sprites/ {
        limit_req zone=sprites burst=60 nodelay;
        proxy_pass http://gateway:8080;
        expires 30d;
    }

    # Admin panel. Restrict it further (VPN, allow-list, basic auth) in
    # production; X-Real-IP feeds its login rate limiter.
    location /admin/ {
        proxy_pass http://admin:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /connection/ {
        proxy_pass http://centrifugo:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ~* \.(wasm|pck)$ {
        types { application/wasm wasm; application/octet-stream pck; }
        expires 7d;
    }
}

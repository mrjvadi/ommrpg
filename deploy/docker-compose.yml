# Full stack: infrastructure + all game services + the web client.
#
#   cp .env.example .env   # set TELEGRAM_BOT_TOKEN and secrets
#   docker compose up -d --build
#
# The game is then served on http://localhost:8088 (put HTTPS in front of it
# for Telegram: Mini Apps must be served over https).
name: ommrpg

x-service: &service
  restart: unless-stopped
  build:
    context: ../backend
  env_file: .env
  environment: &env
    NATS_URL: nats://nats:4222
    DRAGONFLY_URL: redis://dragonfly:6379/0
    CENTRIFUGO_API_URL: http://centrifugo:8000
    CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
    GAME_SECRET: ${GAME_SECRET}
    HEALTH_ADDR: ":8081"
  depends_on:
    nats: { condition: service_started }
    dragonfly: { condition: service_started }
    postgres: { condition: service_healthy }

services:
  # ------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ommrpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ommrpg
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ommrpg"]
      interval: 3s
      retries: 20

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo:/data/db]

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits: { memlock: -1 }
    # Centrifugo's Redis engine uses Lua scripts touching undeclared keys
    command: ["--default_lua_flags=allow-undeclared-keys", "--maxmemory=1gb"]
    volumes: [dragonfly:/data]

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: [nats:/data]

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_RPC_PROXY_ENDPOINT: http://gateway:8080/centrifugo/rpc
      CENTRIFUGO_RPC_PROXY_HTTP_STATIC_HEADERS: '{"X-Proxy-Secret":"${CENTRIFUGO_PROXY_SECRET}"}'
      # Dragonfly as the engine lets Centrifugo run as several nodes
      CENTRIFUGO_ENGINE_TYPE: redis
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://dragonfly:6379
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    depends_on: [dragonfly]

  # ------------------------------------------------------------ services
  identity:
    <<: *service
    build: { context: ../backend, args: { SERVICE: identity } }
    environment:
      <<: *env
      POSTGRES_DSN: postgres://ommrpg:${POSTGRES_PASSWORD}@postgres:5432/identity?sslmode=disable

  world:
    <<: *service
    build: { context: ../backend, args: { SERVICE: world } }
    environment:
      <<: *env
      POSTGRES_DSN: postgres://ommrpg:${POSTGRES_PASSWORD}@postgres:5432/world?sslmode=disable
      WORLD_SEED: ${WORLD_SEED:-0}
      WORLD_SIZE_CHUNKS: ${WORLD_SIZE_CHUNKS:-64}

  character:
    <<: *service
    build: { context: ../backend, args: { SERVICE: character } }
    environment:
      <<: *env
      POSTGRES_DSN: postgres://ommrpg:${POSTGRES_PASSWORD}@postgres:5432/character?sslmode=disable

  item:
    <<: *service
    build: { context: ../backend, args: { SERVICE: item } }
    environment:
      <<: *env
      POSTGRES_DSN: postgres://ommrpg:${POSTGRES_PASSWORD}@postgres:5432/item?sslmode=disable

  asset:
    <<: *service
    build: { context: ../backend, args: { SERVICE: asset } }
    environment:
      <<: *env
      POSTGRES_DSN: postgres://ommrpg:${POSTGRES_PASSWORD}@postgres:5432/asset?sslmode=disable
      # ed25519 seed for OMM Chain block signatures; the public key is shown
      # at /api/v1/chain. Never change it after launch (old blocks stay valid
      # only under the key that signed them).
      CHAIN_SIGNING_KEY: ${CHAIN_SIGNING_KEY}

  ton:
    <<: *service
    build: { context: ../backend, args: { SERVICE: ton } }
    environment:
      <<: *env
      # mock = simulated chain (development); mainnet | testnet = real TON
      TON_MODE: ${TON_MODE:-mock}
      TON_WALLET_SEED: ${TON_WALLET_SEED:-}
      TON_WALLET_VERSION: ${TON_WALLET_VERSION:-v4r2}

  presence:
    <<: *service
    build: { context: ../backend, args: { SERVICE: presence } }

  combat:
    <<: *service
    build: { context: ../backend, args: { SERVICE: combat } }

  dungeon:
    <<: *service
    build: { context: ../backend, args: { SERVICE: dungeon } }

  history:
    <<: *service
    build: { context: ../backend, args: { SERVICE: history } }
    environment:
      <<: *env
      MONGO_URI: mongodb://mongodb:27017
    depends_on: [nats, mongodb]

  sprite:
    <<: *service
    build: { context: ../backend, args: { SERVICE: sprite } }
    environment:
      <<: *env
      SPRITE_CATALOG: /assets/lpc/catalog.json
      # art rendered with Blender (tools/blender/build.sh)
      SPRITE_PACK_DIR: /assets/pack
      SPRITE_CACHE_DIR: /cache
      # "default" lazily downloads LPC art from the catalog's pinned commit;
      # set to "off" and mount spritesheets at /cache/spritesheets for offline use
      SPRITE_REMOTE: ${SPRITE_REMOTE:-default}
    volumes:
      - ../assets:/assets:ro
      - sprites:/cache
    user: "0:0"

  gateway:
    <<: *service
    build: { context: ../backend, args: { SERVICE: gateway } }
    environment:
      <<: *env
      SPRITE_URL: http://sprite:8090
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
      CENTRIFUGO_PROXY_SECRET: ${CENTRIFUGO_PROXY_SECRET}
      CENTRIFUGO_PUBLIC_URL: /connection/websocket
      DEV_LOGIN: ${DEV_LOGIN:-false}

  admin:
    <<: *service
    build: { context: ../backend, args: { SERVICE: admin } }
    environment:
      <<: *env
      POSTGRES_DSN: postgres://ommrpg:${POSTGRES_PASSWORD}@postgres:5432/admin?sslmode=disable
      ADMIN_SECRET: ${ADMIN_SECRET}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-owner}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
      ADMIN_WS_URL: /connection/websocket

  # ------------------------------------------------------------ edge
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8088:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../client/build/web:/usr/share/nginx/html:ro
    depends_on: [gateway, centrifugo, admin]

volumes:
  pg: {}
  mongo: {}
  dragonfly: {}
  nats: {}
  sprites: {}

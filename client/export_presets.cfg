html/head_include="<meta name=\"theme-color\" content=\"#1a1614\">
<script src=\"https://telegram.org/js/telegram-web-app.js\"></script>
<script>
// Launch inside Telegram as a full-screen landscape Mini App as early as
// possible (the game repeats this once loaded; no-op in a normal tab).
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return;
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (tg.isVersionAtLeast('8.0')) tg.requestFullscreen(); } catch (e) {}
  try { if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.setHeaderColor('#1a1614'); tg.setBackgroundColor('#1a1614'); } catch (e) {}
  try { if (tg.isVersionAtLeast('8.0') && window.innerWidth > window.innerHeight) tg.lockOrientation(); } catch (e) {}
})();
</script>
<style>
  html, body { background: #1a1614; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #status { background: #1a1614 !important; }
</style>"
